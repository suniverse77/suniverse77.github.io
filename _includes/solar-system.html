<!-- A small interactive solar system: hover to pause, click a planet for a one-line fact -->

<section id="access-solar">
  <h2 class="panel-heading">Solar System</h2>

  <div class="solar-box">
  <div class="solar">
    <button
      type="button"
      class="solar-sun"
      data-name="Sun"
      data-fact="Holds about 99.8% of all the mass in the solar system."
      aria-label="Sun"
    ></button>

    <div class="solar-orbit" style="--r: 24px; --t: 8s; --d: -0s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #9a9a9a; --s: 5px"
        data-name="Mercury"
        data-fact="The closest planet to the Sun, orbiting it once every 88 days."
        aria-label="Mercury"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 36px; --t: 13s; --d: -11s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #e0b65c; --s: 7px"
        data-name="Venus"
        data-fact="The hottest planet, with a surface at about 460°C."
        aria-label="Venus"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 48px; --t: 18s; --d: -2s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #4a90d9; --s: 7px"
        data-name="Earth"
        data-fact="About 70% of its surface is covered by ocean."
        aria-label="Earth"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 60px; --t: 26s; --d: -7s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #c8553d; --s: 6px"
        data-name="Mars"
        data-fact="Home to Olympus Mons, the tallest volcano in the solar system."
        aria-label="Mars"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 75px; --t: 40s; --d: -28s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #d2a679; --s: 12px"
        data-name="Jupiter"
        data-fact="The largest planet; about 1,300 Earths would fit inside it."
        aria-label="Jupiter"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 90px; --t: 54s; --d: -23s">
      <button
        type="button"
        class="solar-planet solar-ringed"
        style="--c: #d9c38a; --s: 10px"
        data-name="Saturn"
        data-fact="Its rings are made mostly of chunks of ice."
        aria-label="Saturn"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 102px; --t: 70s; --d: -12s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #8fd3d6; --s: 8px"
        data-name="Uranus"
        data-fact="Tilted about 98 degrees, it orbits the Sun on its side."
        aria-label="Uranus"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 113px; --t: 88s; --d: -83s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #4f6fd8; --s: 8px"
        data-name="Neptune"
        data-fact="Takes about 165 years to orbit the Sun once."
        aria-label="Neptune"
      ></button>
    </div>
  </div>

  <p class="solar-caption" aria-live="polite">
    <strong>Solar System</strong>
    <span>Click a planet.</span>
  </p>
  </div>
</section>

<script>
  (function () {
    const root = document.getElementById('access-solar');
    if (!root) {
      return;
    }
    const name = root.querySelector('.solar-caption strong');
    const fact = root.querySelector('.solar-caption span');
    const defaultName = name.textContent;
    const defaultFact = fact.textContent;
    const bodies = root.querySelectorAll('.solar-sun, .solar-planet');
    bodies.forEach((body) => {
      body.addEventListener('click', () => {
        const wasSelected = body.classList.contains('selected');
        bodies.forEach((other) => other.classList.remove('selected'));
        if (wasSelected) {
          name.textContent = defaultName;
          fact.textContent = defaultFact;
          return;
        }
        body.classList.add('selected');
        name.textContent = body.dataset.name;
        fact.textContent = body.dataset.fact;
      });
    });
  })();
</script>
