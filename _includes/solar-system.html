<!-- A small interactive solar system: hover to pause, click a planet for a one-line fact -->

<section id="access-solar">
  <div class="solar-box">
  <div class="solar">
    <button
      type="button"
      class="solar-sun"
      data-name="Sun"
      data-fact="Holds about 99.8% of all the mass in the solar system."
      aria-label="Sun"
    ></button>

    <div class="solar-orbit" style="--r: 24; --t: 8s; --d: -0s">
      <button
        type="button"
        class="solar-planet p-mercury"
        style="--s: 7"
        data-name="Mercury"
        data-fact="The closest planet to the Sun, orbiting it once every 88 days."
        aria-label="Mercury"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 36; --t: 13s; --d: -11s">
      <button
        type="button"
        class="solar-planet p-venus"
        style="--s: 9"
        data-name="Venus"
        data-fact="The hottest planet, with a surface at about 460°C."
        aria-label="Venus"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 48; --t: 18s; --d: -2s">
      <button
        type="button"
        class="solar-planet p-earth"
        style="--s: 10"
        data-name="Earth"
        data-fact="About 70% of its surface is covered by ocean."
        aria-label="Earth"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 60; --t: 26s; --d: -7s">
      <button
        type="button"
        class="solar-planet p-mars"
        style="--s: 8"
        data-name="Mars"
        data-fact="Home to Olympus Mons, the tallest volcano in the solar system."
        aria-label="Mars"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 75; --t: 40s; --d: -28s">
      <button
        type="button"
        class="solar-planet p-jupiter"
        style="--s: 16"
        data-name="Jupiter"
        data-fact="The largest planet; about 1,300 Earths would fit inside it."
        aria-label="Jupiter"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 90; --t: 54s; --d: -23s">
      <button
        type="button"
        class="solar-planet p-saturn"
        style="--s: 13"
        data-name="Saturn"
        data-fact="Its rings are made mostly of chunks of ice."
        aria-label="Saturn"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 102; --t: 70s; --d: -12s">
      <button
        type="button"
        class="solar-planet p-uranus"
        style="--s: 11"
        data-name="Uranus"
        data-fact="Tilted about 98 degrees, it orbits the Sun on its side."
        aria-label="Uranus"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 113; --t: 88s; --d: -83s">
      <button
        type="button"
        class="solar-planet p-neptune"
        style="--s: 11"
        data-name="Neptune"
        data-fact="Takes about 165 years to orbit the Sun once."
        aria-label="Neptune"
      ></button>
    </div>
  </div>

  <!-- Photos: public-domain NASA images from Wikimedia Commons, in assets/images/solar/ -->
  <div class="solar-info" data-photo-base="{{ '/assets/images/solar/' | relative_url }}">
    <p class="solar-caption" aria-live="polite">
      <strong>Solar System</strong>
      <span>Click a planet.</span>
    </p>
  </div>
  </div>
</section>

<script>
  (function () {
    const root = document.getElementById('access-solar');
    if (!root) {
      return;
    }
    const info = root.querySelector('.solar-info');
    const photo = document.createElement('img');
    photo.className = 'solar-photo';
    photo.alt = '';
    const name = root.querySelector('.solar-caption strong');
    const fact = root.querySelector('.solar-caption span');
    const defaultName = name.textContent;
    const defaultFact = fact.textContent;
    const bodies = root.querySelectorAll('.solar-sun, .solar-planet');
    bodies.forEach((body) => {
      body.addEventListener('click', () => {
        const wasSelected = body.classList.contains('selected');
        bodies.forEach((other) => other.classList.remove('selected'));
        if (wasSelected) {
          name.textContent = defaultName;
          fact.textContent = defaultFact;
          photo.remove();
          return;
        }
        body.classList.add('selected');
        photo.src = info.dataset.photoBase + body.dataset.name.toLowerCase() + '.jpg';
        info.prepend(photo);
        name.textContent = body.dataset.name;
        fact.textContent = body.dataset.fact;
      });
    });
  })();
</script>
