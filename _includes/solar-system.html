<!-- A small interactive solar system: hover to pause, click a planet for a one-line fact -->

<section id="access-solar">
  <h2 class="panel-heading">Solar System</h2>

  <div class="solar">
    <button
      type="button"
      class="solar-sun"
      data-name="태양"
      data-fact="태양계 전체 질량의 약 99.8%를 차지합니다."
      aria-label="태양"
    ></button>

    <div class="solar-orbit" style="--r: 24px; --t: 8s; --d: -0s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #9a9a9a; --s: 5px"
        data-name="수성"
        data-fact="태양에 가장 가까운 행성으로, 약 88일마다 태양을 한 바퀴 돕니다."
        aria-label="수성"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 36px; --t: 13s; --d: -11s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #e0b65c; --s: 7px"
        data-name="금성"
        data-fact="표면 온도가 약 460°C로, 태양계에서 가장 뜨거운 행성입니다."
        aria-label="금성"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 48px; --t: 18s; --d: -2s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #4a90d9; --s: 7px"
        data-name="지구"
        data-fact="표면의 약 70%가 바다로 덮여 있습니다."
        aria-label="지구"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 60px; --t: 26s; --d: -7s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #c8553d; --s: 6px"
        data-name="화성"
        data-fact="태양계에서 가장 높은 화산인 올림푸스 몬스가 있습니다."
        aria-label="화성"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 75px; --t: 40s; --d: -28s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #d2a679; --s: 12px"
        data-name="목성"
        data-fact="태양계에서 가장 큰 행성으로, 지구가 1,300개쯤 들어갑니다."
        aria-label="목성"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 90px; --t: 54s; --d: -23s">
      <button
        type="button"
        class="solar-planet solar-ringed"
        style="--c: #d9c38a; --s: 10px"
        data-name="토성"
        data-fact="고리는 대부분 얼음 조각으로 이루어져 있습니다."
        aria-label="토성"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 102px; --t: 70s; --d: -12s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #8fd3d6; --s: 8px"
        data-name="천왕성"
        data-fact="자전축이 약 98도 기울어져, 누운 채로 태양을 돕니다."
        aria-label="천왕성"
      ></button>
    </div>
    <div class="solar-orbit" style="--r: 113px; --t: 88s; --d: -83s">
      <button
        type="button"
        class="solar-planet"
        style="--c: #4f6fd8; --s: 8px"
        data-name="해왕성"
        data-fact="태양을 한 바퀴 도는 데 약 165년이 걸립니다."
        aria-label="해왕성"
      ></button>
    </div>
  </div>

  <p class="solar-caption" aria-live="polite">
    <strong>태양계</strong>
    <span>행성을 눌러 보세요.</span>
  </p>
</section>

<script>
  (function () {
    const root = document.getElementById('access-solar');
    if (!root) {
      return;
    }
    const name = root.querySelector('.solar-caption strong');
    const fact = root.querySelector('.solar-caption span');
    const bodies = root.querySelectorAll('.solar-sun, .solar-planet');
    bodies.forEach((body) => {
      body.addEventListener('click', () => {
        bodies.forEach((other) => other.classList.remove('selected'));
        body.classList.add('selected');
        name.textContent = body.dataset.name;
        fact.textContent = body.dataset.fact;
      });
    });
  })();
</script>
